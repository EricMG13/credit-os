name: python

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked python tools/gates.py

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Changed lines at most 800
        env:
          BASE: ${{ github.base_ref }}
        run: |
          n=$(git diff --numstat "origin/$BASE...HEAD" -- . ':!*.lock' ':!package-lock.json' ':!pnpm-lock.yaml' ':!Package.resolved')
          echo "$n" | awk '{s+=$1+$2} END{print s " changed lines"; exit s>800}'
