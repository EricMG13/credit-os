name: python

# The gates read nothing under web/ except the jscpd pinned by those two files (decision 0005),
# so a change to front-end files alone does not run them on a pull request. The filter applies
# to pull requests only; scheduled runs take no paths filter. The review job lives in
# review.yml, so it still runs on every pull request.
on:
  pull_request:
    paths:
      - "**"
      - "!web/**"
      - "web/package.json"
      - "web/package-lock.json"
  # main is checked every three hours and on demand, not on every merge, because each pull
  # request already ran these gates and per-merge reruns filled the runner queue (measured
  # 2026-11-15: 34 of 200 runs queued). The cost: a break caused by two pull requests combining
  # shows up at the next scheduled run, not at merge.
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

# A newer push to the same pull request cancels its older run. Scheduled and manual runs on
# main are keyed by commit, so one is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.12.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: uv sync --locked
      - run: uv run --locked python tools/gates.py
