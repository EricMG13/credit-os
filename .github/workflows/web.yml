name: web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  # main is checked every three hours and on demand, not on every merge, because each pull
  # request already ran these gates and per-merge reruns filled the runner queue (measured
  # 2026-11-15: 34 of 200 runs queued). The cost: a break caused by two pull requests combining
  # shows up at the next scheduled run, not at merge.
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:

# A newer push to the same pull request cancels its older run. Scheduled and manual runs are
# keyed by commit, so a running one is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    # Measured on main at 4a0cbdbb, Windows: gates 10 min, each open-from-disk check about 6 min,
    # so the job needs about 23 min plus set-up; at 20 it was cancelled, not failed. Linux takes
    # about 8 min. The limit stays as the guard against a hung browser.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gates
      - name: Open from disk in Edge (Windows)
        if: runner.os == 'Windows'
        run: node scripts/open-from-disk.mjs
        env:
          CHROME_PATH: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
      - name: Open from disk in Chrome (Windows)
        if: runner.os == 'Windows'
        run: node scripts/open-from-disk.mjs
        env:
          CHROME_PATH: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
