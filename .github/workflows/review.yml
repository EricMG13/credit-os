name: review

on: pull_request

# A newer push to the same pull request cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Changed lines at most 800
        env:
          BASE: ${{ github.base_ref }}
        run: |
          n=$(git diff --numstat "origin/$BASE...HEAD" -- . ':!*.lock' ':(exclude,glob)**/package-lock.json' ':(exclude,glob)**/pnpm-lock.yaml' ':(exclude,glob)**/Package.resolved' ':(exclude,glob)tests/fixtures/handoffs/**')
          echo "$n" | awk '{s+=$1+$2} END{print s " changed lines"; exit s>800}'
