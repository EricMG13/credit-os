[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credit-os"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.13.4"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "mypy==1.18.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.169.2",
    "complexipy==8.0.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.uv]
required-version = ">=0.12.5,<0.13"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = [
    "live: runs a real provider",
    "browser: needs a browser",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
strict = true
